# Netlify configuration for the design template library.
# The site is fully static — no build step, no dependencies to install.

# `netlify init` left two bad values in the site's stored build settings: the
# publish directory as " ." (with a leading space) and the build command as the
# literal string "# no build command". These netlify.toml values take precedence
# over the stored ones, so they are stated explicitly rather than left empty --
# an empty command falls back to the stored one.
[build]
  publish = "."
  command = "echo 'static site: pages are committed pre-built, nothing to compile'"

# The site's stored settings point at this directory. It is empty and this site
# has no functions, but a configured directory that does not exist fails the
# Deploying stage, so it is declared here and kept in the repo.
[functions]
  directory = "netlify/functions"


# Long-lived caching for generated pages' assets is unnecessary (everything is
# inlined), but the pages themselves should revalidate so a rebuild shows up.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/designs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
