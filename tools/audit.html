<!doctype html><meta charset=utf-8><title>audit</title>
<style>body{margin:0;font:12px system-ui;background:#111;color:#eee}
#f{display:flex;gap:8px;overflow-x:auto;padding:8px}
iframe{width:375px;height:760px;border:0;background:#fff;flex:none}</style>
<div id=f></div>
<script>
const SLUGS=["airbnb", "airtable", "apple", "binance", "bmw", "bmw-m", "bugatti", "cal", "claude", "clay", "clickhouse", "cohere", "coinbase", "composio", "cursor", "dell-1996", "elevenlabs", "expo", "ferrari", "figma", "framer", "hashicorp", "hp", "ibm", "intercom", "kraken", "lamborghini", "linear.app", "lovable", "mastercard", "meta", "minimax", "mintlify", "miro", "mistral.ai", "mongodb", "nike", "nintendo-2001", "notion", "nvidia", "ollama", "opencode.ai", "pinterest", "playstation", "posthog", "raycast", "renault", "replicate", "resend", "revolut", "runwayml", "sanity", "sentry", "shopify", "slack", "spacex", "spotify", "starbucks", "stripe", "supabase", "superhuman", "tesla", "theverge", "together.ai", "uber", "vercel", "vodafone", "voltagent", "warp", "webflow", "wired", "wise", "x.ai", "zapier"];
const box=document.getElementById('f');
window.ready=new Promise(res=>{
  let left=SLUGS.length;
  SLUGS.forEach(s=>{
    const i=document.createElement('iframe');
    // cache-bust, or a re-run silently measures the previous build
    i.dataset.slug=s; i.src='../designs/'+s+'.html?v='+Date.now();
    i.onload=()=>{ if(--left===0) res(true); };
    box.appendChild(i);
  });
});
window.audit=function(){
  return [...document.querySelectorAll('iframe')].map(f=>{
    const d=f.contentDocument, w=f.contentWindow, de=d.documentElement, o={slug:f.dataset.slug};
    o.vw=de.clientWidth;
    o.hscroll=de.scrollWidth-de.clientWidth;
    let worst=null;
    d.querySelectorAll('body *').forEach(el=>{const r=el.getBoundingClientRect();
      if(r.width>0&&r.right>de.clientWidth+1){if(!worst||r.right>worst.r)worst={s:(el.className||el.tagName).toString().slice(0,40),r:Math.round(r.right)};}});
    o.overflow=worst;
    o.noAlt=[...d.images].filter(i=>!i.alt||!i.alt.trim()).length;
    o.imgs=d.images.length;
    const small=[];
    d.querySelectorAll('a,button,summary,input').forEach(el=>{const r=el.getBoundingClientRect();
      if(!r.height||el.closest('.libbar'))return;
      if(r.height<44-.5)small.push((el.className||el.tagName).toString().slice(0,26)+':'+Math.round(r.height));});
    o.small=small.length; o.smallEg=[...new Set(small)].slice(0,5);
    o.bodyPx=parseFloat(w.getComputedStyle(d.body).fontSize);
    // real contrast of small text against whatever is actually behind it
    const px=c=>{const m=c.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]];};
    const lum=r=>{const f=x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)};
      return .2126*f(r[0])+.7152*f(r[1])+.0722*f(r[2])};
    const ratio=(a,b)=>{const l=[lum(a),lum(b)].sort((x,y)=>y-x);return (l[0]+.05)/(l[1]+.05)};
    // Walk to the first painted background. A background *image* or gradient on
    // the way up means the real ground is a photograph or ramp we can't sample,
    // so the measurement below would compare against the wrong colour entirely -
    // report those separately instead of counting them as failures.
    const bgOf=el=>{let n=el,img=false;const r=el.getBoundingClientRect();while(n&&n!==d.documentElement){
      const cs=w.getComputedStyle(n);
      if(cs.backgroundImage&&cs.backgroundImage!=='none')img=true;
      // a photographic ground is just as often an <img>/<video> layer under the
      // text as a CSS background, and it is equally unsamplable
      // the photo is often a positioned media layer nested a level or two down
      // (.hero > .hero-media > img), not a direct child of the text's ancestor
      if(!img&&n.querySelector&&[...n.querySelectorAll('img,video,picture,canvas')]
         .some(k=>{const b=k.getBoundingClientRect();
           return b.width>120&&b.height>60&&b.top<=r.top&&b.bottom>=r.bottom;}))img=true;
      const c=cs.backgroundColor;
      if(c&&!/rgba\(0, 0, 0, 0\)|transparent/.test(c))return {rgb:px(c),img:img};
      n=n.parentElement;}
      return {rgb:px(w.getComputedStyle(d.body).backgroundColor),img:img};};
    const low=[],overImg=[];
    const TEXT='.eyebrow, .ts-meta code, .btn-ghost, .card-look, .feat-body, .sw-note,'
      +' .ts-code, .sw-val, .metric-l, .logo-item, .spec-note, .tier-desc, .foot-legal,'
      +' .sc-points li, .faq-q, .quote-by, .g-item figcaption, .tier-feats li, p, li, td,'
      // headline emphasis is styled independently of body roles and had its own
      // accent-as-text bug (pale yellow on a yellow highlight block)
      +' h1, h2, h3, h4, em, strong, mark, b, .hero-title, .sec-title, .metric-v, .tier-price';
    d.querySelectorAll(TEXT).forEach(el=>{
      const r=el.getBoundingClientRect(); if(!r.height) return;
      // Only an element's OWN text nodes are painted in its own colour. A wrapper
      // whose text all lives in children (a footer <li> holding one <a>) paints
      // nothing at that colour, so measuring it invents a failure.
      if(![...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())) return;
      const cs=w.getComputedStyle(el);
      if(cs.visibility==='hidden'||cs.opacity==='0') return;
      const size=parseFloat(cs.fontSize), weight=parseInt(cs.fontWeight)||400;
      const large=size>=24||(size>=18.66&&weight>=700);
      const need=large?3:4.5;
      const g=bgOf(el);
      const cr=ratio(px(cs.color), g.rgb);
      if(cr>=need-0.05) return;
      const tag=(el.className||el.tagName).toString().slice(0,20)+':'+cr.toFixed(2);
      (g.img?overImg:low).push(tag);
    });
    o.overImage=overImg.length;
    o.lowContrast=low.length; o.lowEg=[...new Set(low)].slice(0,4);
    // every Phosphor <i> must actually resolve a glyph
    const ics=[...d.querySelectorAll('i[class*="ph"]')];
    const dead=ics.filter(i=>{const c=w.getComputedStyle(i,'::before').content;
      return !c||c==='none'||c==='normal';});
    o.icons=ics.length; o.deadIcons=dead.length;
    o.deadEg=[...new Set(dead.map(i=>i.className))].slice(0,3);
    // A card the design has painted needs its inner padding. Variant rules like
    // `.v-flat .feat-card { padding-inline: 0 }` outrank a design's own
    // `.feat-card { padding: 26px }`, leaving text flush against a filled edge.
    const flush=[];
    // .g-item is excluded on purpose: a gallery tile's image is meant to bleed to
    // the edge, with the caption overlaid absolutely on top of it.
    d.querySelectorAll('.feat-card, .tier, .zoo-cell, .quote-card').forEach(el=>{
      const cs=w.getComputedStyle(el);
      const painted = (cs.backgroundImage&&cs.backgroundImage!=='none') ||
        (cs.backgroundColor&&!/rgba\(0, 0, 0, 0\)|transparent/.test(cs.backgroundColor));
      if(!painted) return;
      const pl=parseFloat(cs.paddingLeft)||0, pr=parseFloat(cs.paddingRight)||0;
      if(pl>=8&&pr>=8) return;
      // only counts if normally-flowing text actually sits on that edge
      const flowing=[...el.querySelectorAll('h1,h2,h3,h4,p,li,span')].some(t=>{
        if(!t.textContent||!t.textContent.trim())return false;
        if(w.getComputedStyle(t).position==='absolute')return false;
        return t.getBoundingClientRect().left - el.getBoundingClientRect().left < 8;
      });
      if(flowing) flush.push((el.className||el.tagName).toString().slice(0,22)+':'+pl+'/'+pr);
    });
    o.flushText=flush.length; o.flushEg=[...new Set(flush)].slice(0,4);

    // An inner element that scrolls sideways. Wide tables opt into this on
    // purpose; chrome like the library bar does not.
    const sideways=[];
    d.querySelectorAll('*').forEach(el=>{
      if(el.scrollWidth<=el.clientWidth+1) return;
      const cs=w.getComputedStyle(el);
      if(!/auto|scroll/.test(cs.overflowX)) return;
      if(!el.getBoundingClientRect().height) return;
      if(el.closest('.tbl-wrap, .tblwrap, .code, pre')) return;  // deliberate
      sideways.push((el.className||el.tagName).toString().slice(0,20)+':'+el.clientWidth+'<'+el.scrollWidth);
    });
    o.sideways=sideways.length; o.sidewaysEg=[...new Set(sideways)].slice(0,4);

    // The page's sticky nav parks below the library bar. If the bar's height and
    // the nav's offset ever drift apart, the nav's first row is hidden behind it.
    (function(){
      const bar=d.querySelector('.libbar'), nav=d.querySelector('.nav');
      if(!bar||!nav){o.navOccluded=0;return}
      const y=w.scrollY; w.scrollTo(0,1400);
      const rb=bar.getBoundingClientRect(), rn=nav.getBoundingClientRect();
      o.navOccluded=Math.max(0, Math.round(rb.bottom - rn.top));
      o.libbarH=Math.round(rb.height);
      w.scrollTo(0,y);
    })();

    o.burger=w.getComputedStyle(d.querySelector('.nav-burger')).display;
    o.navLinks=w.getComputedStyle(d.querySelector('.nav-links')).display;
    return o;
  });
};
</script>
